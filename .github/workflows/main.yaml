name: Build and Release
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout release ref
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
        fetch-depth: 0
        fetch-tags: true
    - name: Verify release tag
      shell: bash
      run: |
        if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
          release_tag="${{ inputs.release_tag }}"
        else
          release_tag="${GITHUB_REF#refs/tags/}"
        fi
        git fetch --force --tags origin
        tag_commit=$(git rev-list -n 1 "$release_tag")
        head_commit=$(git rev-parse HEAD)
        [[ -n "$tag_commit" && "$tag_commit" == "$head_commit" ]]
        version=$(sed -n 's/^const DiskTestVersion = "\(v[0-9.]*\)"$/\1/p' disk/version.go)
        [[ "$version" == "$release_tag" ]]
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    - name: Test
      shell: bash
      run: |
        set -euo pipefail
        go mod verify
        go test -race -count=1 ./...
    - name: Vet
      run: go vet ./...
    env:
      GOPROXY: https://proxy.golang.org|direct
  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
    - name: Load trusted network recovery helpers
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-max-time 180 --retry-connrefused "https://raw.githubusercontent.com/oneclickvirt/disktest/main/.github/scripts/ci_network.sh" -o "$RUNNER_TEMP/ci-network.sh"
    - name: Resolve release tag
      shell: bash
      run: |
        if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
          echo "RELEASE_TAG=${{ inputs.release_tag }}" >> "$GITHUB_ENV"
        else
          echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
        fi
    - name: Create versioned release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        source "$RUNNER_TEMP/ci-network.sh"
        gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$RELEASE_TAG" --generate-notes
      shell: bash
  build:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - goos: linux
          goarch: amd64
        - goos: linux
          goarch: '386'
        - goos: linux
          goarch: arm
          goarm: '7'
        - goos: linux
          goarch: arm64
        - goos: linux
          goarch: riscv64
        - goos: linux
          goarch: mips
        - goos: linux
          goarch: mipsle
        - goos: linux
          goarch: mips64
        - goos: linux
          goarch: mips64le
        - goos: linux
          goarch: ppc64
        - goos: linux
          goarch: ppc64le
        - goos: freebsd
          goarch: amd64
        - goos: freebsd
          goarch: '386'
        - goos: freebsd
          goarch: arm
          goarm: '7'
        - goos: freebsd
          goarch: arm64
        - goos: darwin
          goarch: amd64
        - goos: darwin
          goarch: arm64
        - goos: windows
          goarch: '386'
        - goos: windows
          goarch: amd64
        - goos: windows
          goarch: arm64
    steps:
    - name: Load trusted network recovery helpers
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-max-time 180 --retry-connrefused "https://raw.githubusercontent.com/oneclickvirt/disktest/main/.github/scripts/ci_network.sh" -o "$RUNNER_TEMP/ci-network.sh"
    - name: Checkout release ref
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    - name: Resolve release tag
      shell: bash
      run: |
        if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
          echo "RELEASE_TAG=${{ inputs.release_tag }}" >> "$GITHUB_ENV"
        else
          echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
        fi
    - name: Build binary
      shell: bash
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        GOARM: ${{ matrix.goarm }}
        CGO_ENABLED: '0'
      run: |
        suffix=""
        [[ "$GOOS" == "windows" ]] && suffix=".exe"
        artifact="disktest-${GOOS}-${GOARCH}${suffix}"
        go build -trimpath -ldflags="-s -w" -o "$artifact" ./cmd
        echo "ARTIFACT=$artifact" >> "$GITHUB_ENV"
    - name: Upload release asset
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        source "$RUNNER_TEMP/ci-network.sh"
        gh release upload "$RELEASE_TAG" "$ARTIFACT" --repo "$GITHUB_REPOSITORY" --clobber
      shell: bash
    env:
      GOPROXY: https://proxy.golang.org|direct
'on':
  push:
    tags:
    - v*
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to release
        required: true
        type: string
