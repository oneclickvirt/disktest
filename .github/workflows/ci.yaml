name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          go test -race -count=1 ./...

      - name: Vet
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          go build -o "$RUNNER_TEMP/disktest" ./cmd
